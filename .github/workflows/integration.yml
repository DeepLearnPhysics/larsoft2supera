name: ICARUS integration (provisioned runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    # Requires an explicitly provisioned runner; never run untrusted PR code here.
    runs-on: [self-hosted, linux, icarus-v10-27-00]
    timeout-minutes: 30
    env:
      ICARUS_PRODUCTS: ${{ vars.ICARUS_PRODUCTS }}
      FIXTURE_ROOT: ${{ vars.OPTICAL_FIXTURE_ROOT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DeepLearnPhysics/SuperaAtomic
          ref: 77953b3ab72e139c28772004ddc3c8a94bc602b9
          path: build/deps/SuperaAtomic
          persist-credentials: false
      - name: Build, install, consume, and compare in the pinned release
        shell: bash
        run: |
          test -d "$ICARUS_PRODUCTS"
          test -d "$FIXTURE_ROOT"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -v "$ICARUS_PRODUCTS:/products:ro" \
            -v "$FIXTURE_ROOT:/fixtures:ro" -w /work \
            -e SUPERA_SOURCE=/work/build/deps/SuperaAtomic \
            -e FIXTURE_ROOT=/fixtures -e VALIDATION_DIR=/work/build/integration-results \
            --entrypoint /bin/bash \
            fermilab/fnal-dev-sl7@sha256:2191aae074d1adc992910afef657430b3c3e1cb155a58460b13023ea93393e5f \
            -lc 'export UPS_OVERRIDE="-H Linux64bit+3.10-2.17"; source /products/setup && setup icaruscode v10_27_00 -q e26:prof && bash tools/integration.sh'
